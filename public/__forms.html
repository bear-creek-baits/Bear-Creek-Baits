<!doctype html>
<!--
  Netlify Forms reads these at deploy time to learn each form's name and fields. Nobody sees this page:
  the real forms are the React ones on /order/ and /contact/, which post here (see src/lib/forms.ts).
  A field missing from this file is dropped from submissions, so add any new field here too.
  Catch photos don't use Netlify Forms: they go to the catch approval function (netlify/functions/catch-submit.ts).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <form name="order" data-netlify="true" netlify-honeypot="_gotcha" hidden>
      <input name="name" />
      <input name="email" type="email" />
      <input name="contactBy" />
      <input name="phone" />
      <input name="location" />
      <textarea name="notes"></textarea>
      <textarea name="order"></textarea>
      <input name="_gotcha" />
    </form>

    <form name="contact" data-netlify="true" netlify-honeypot="_gotcha" hidden>
      <input name="name" />
      <input name="email" type="email" />
      <input name="topic" />
      <textarea name="message"></textarea>
      <input name="_gotcha" />
    </form>
  </body>
</html>
