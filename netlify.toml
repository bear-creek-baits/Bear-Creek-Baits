# Netlify build settings. The site is a static export (next.config.ts: output 'export'), so
# Netlify just runs the build and serves the out/ folder. No server or Next.js runtime is needed.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  # The order, contact and catch forms post here (Netlify Forms; definitions in public/__forms.html).
  NEXT_PUBLIC_FORM_ENDPOINT = "/__forms.html"

# Built JS/CSS file names change on every build, so they can be cached forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
